# Built to WebAssembly by `npm run build:extensions`. Its own workspace root, so the default
# `cargo test --workspace` doesn't need the wasm target.
[package]
name = "es_morph_hints"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
