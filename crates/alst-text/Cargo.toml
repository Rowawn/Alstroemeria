[package]
name = "alst-text"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
scraper = "0.23"
ureq = "3"
encoding_rs = "0.8"
lindera = { version = "=6.2.0", default-features = false, features = ["mmap"], optional = true }
sha2 = "0.10"

[features]
# The engine; dictionaries come from installed language data (SPEC §17.3).
lang-ja = ["dep:lindera"]
lang-ko = ["dep:lindera"]
# Compile a dictionary in (tests and development only: release builds leave these off).
embed-ja = ["lang-ja", "lindera/embed-ipadic"]
embed-ko = ["lang-ko", "lindera/embed-ko-dic"]
embed-langdata = ["embed-ja", "embed-ko"]
default = ["lang-ja", "lang-ko", "embed-langdata"]
