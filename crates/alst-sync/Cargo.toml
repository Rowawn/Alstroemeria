[package]
name = "alst-sync"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
alst-core = { path = "../alst-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
if-addrs = "0.13"
mdns-sd = "0.13"
snow = "0.10"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
